version: 2.1

jobs:
  q_hat:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: At the same time poll firmware
          command: |
            mkdir -p /var/tmp/alpha1
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "k-$((i*7))"; done > /var/tmp/alpha1/AmBErgReengaMMA; true
            echo "phase-preview-build=$(wc -c </var/tmp/alpha1/AmBErgReengaMMA)"
      - persist_to_workspace:
          root: /var/tmp/alpha1
          paths:
            - 'AmBErgReengaMMA'
  preview-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/alpha1
      - run:
          name: Size handoff
          command: |
            xxd -p /var/tmp/alpha1/AmBErgReengaMMA 2>/dev/null | head -c 40 || true
      - run:
          name: Load repo
          command: git clone --depth 1 -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Prime workspace
          command: tar -xf mirror-dist.tar
      - run:
          name: Validate binary
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Workspace summary
          command: uname -a
      - run:
          command: exec ./init-scheduler
